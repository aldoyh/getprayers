<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Full Screen Splash</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            overflow: hidden;
        }

        .splash {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 200px;
            height: 200px;
            background: url('static/salati-app-icon.png') no-repeat center/contain;
            z-index: 10;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="splash">
        <div class="logo"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        const splash = document.querySelector('.splash');
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const colors = ["#ffcc00", "#ff4444", "#44ccff", "#ffffff", "#ff66cc"];

        const particles = [];

        for (let i = 0; i < 200; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            splash.appendChild(p);

            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 500 + 150;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed - 250;

            particles.push({
                el: p,
                x: centerX,
                y: centerY,
                vx,
                vy,
                opacity: 1,
                size: Math.random() * 6 + 4
            });

            p.style.width = p.style.height = particles[particles.length - 1].size + "px";
        }

        gsap.ticker.add(() => {
            particles.forEach((particle, index) => {
                particle.vy += 15;
                particle.vx *= 0.97;
                particle.vy *= 0.97;

                particle.x += particle.vx * 0.016;
                particle.y += particle.vy * 0.016;

                particle.opacity -= 0.006;

                particle.el.style.transform = `translate(${particle.x}px, ${particle.y}px)`;
                particle.el.style.opacity = particle.opacity;

                if (particle.opacity <= 0) {
                    particle.el.remove();
                    particles.splice(index, 1);
                }
            });

            if (particles.length === 0) {
                gsap.ticker.removeAll();
            }
        });

        gsap.from(".logo", {
            scale: 0,
            opacity: 0,
            duration: 1.8,
            ease: "elastic.out(1, 0.5)"
        });

        gsap.to(".logo", {
            opacity: 0,
            duration: 1.2,
            delay: 5,
            ease: "power2.in",
            onComplete: () => {
                document.querySelector('.splash').style.display = 'none';
            }
        });
    </script>
</body>

</html>
